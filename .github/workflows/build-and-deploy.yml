name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs on main wait for each other, so deploys happen in push order. A new push to a pull request
# cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION_PATH: PicktimeAutomation/PicktimeAutomation.AzureFunctions.slnx
  FUNCTION_PROJECT_PATH: PicktimeAutomation/PicktimeAutomation.AzureFunctions/PicktimeAutomation.AzureFunctions.csproj
  FUNCTION_APP_NAME: func-picktime-automation
  PUBLISH_DIRECTORY: publish
  ARTIFACT_NAME: function-app

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # NuGet Audit runs on restore. Here its vulnerability warnings are errors, so a vulnerable
      # package stops the build and never deploys (plan section 8.4). %3B is an escaped semicolon.
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }} -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build

      - name: Publish
        run: dotnet publish ${{ env.FUNCTION_PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_DIRECTORY }}

      - name: Upload the published app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIRECTORY }}
          # The isolated worker needs the hidden .azurefunctions folder.
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    # The federated credential trusts only the subject of a push to main (plan section 8.4).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    # Do not add environment:. A job with an environment sends a different subject, and the sign-in fails.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the published app
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIRECTORY }}

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.PUBLISH_DIRECTORY }}
